; Appended to the runtime's php.ini by vercel-php.
; Vercel rejects request bodies over 4.5 MB, so uploads can't usefully exceed that.
upload_max_filesize = 4M
post_max_size = 5M
memory_limit = 512M
max_execution_time = 60

; Errors go to the function logs, never into the page.
display_errors = Off
log_errors = On
error_log = /dev/stderr
